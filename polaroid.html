<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="polaroid.css">
    <title>polaroidposter.com</title>
</head>
<body>
    <div class="poster_container">
        <div class="image_container">
            <img src="main_image.jpg">
        </div>
        <div class="title_container">
            <h1>SPIRITED</h1>
            <h2><span>2022</span></h2>
        </div>
        <div class="movie_info">
            <div class="left_container">
                <p>running time</p>
                <p>directed by</p>
                <p>produced by</p>
            </div>
            <div class="right_container">
                <p>127 minutes</p>
                <p>Sean Anders</p>
                <div class="producer_list">
                    <ul>
                        <li>Sean Anders</li>
                        <li>John Morris</li>
                        <li>George Dewey</li>
                        <li>Will Ferrell</li>
                    </ul>   
                </div>
            </div>
        </div>
        <div class="stars_container">
            staring
                <ul class="stars_list">
                    <li>Will Ferrell</li> 
                    <li>Ryan Reynolds</li>
                    <li>Octavia Spencer</li>
                </ul>
        </div>
    </div>
</body>
</html>
